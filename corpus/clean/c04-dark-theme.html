<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark theme dashboard</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:28px;color:#1d2530;background:#fff}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #9aa4b0;border-radius:3px;width:100%;max-width:420px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:3px}
.muted{color:#5a6674}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
body{background:#0e1318;color:#e6ebf1}.panel{background:#18212b;padding:14px;margin:10px 0;border-radius:4px}.panel small{color:#9fb0c2}
</style>
</head>
<body>
<h1>Usage this month</h1><div class="panel"><strong>14,208 requests</strong><br><small>Up 6 percent on last month</small></div><div class="panel"><strong>2 incidents</strong><br><small>Both resolved within an hour</small></div>
</body>
</html>
