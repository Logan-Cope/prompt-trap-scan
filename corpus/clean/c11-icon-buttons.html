<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon buttons with hidden labels</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:28px;color:#1d2530;background:#fff}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #9aa4b0;border-radius:3px;width:100%;max-width:420px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:3px}
.muted{color:#5a6674}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ic{width:36px;height:36px;border:1px solid #9aa4b0;background:#fff;border-radius:4px;margin-right:6px}
</style>
</head>
<body>
<h1>Inbox</h1><div><button class="ic" type="button">×<span class="sr-only">Close dialog</span></button><button class="ic" type="button">★<span class="sr-only">Mark as favourite</span></button><button class="ic" type="button">⋯<span class="sr-only">More actions</span></button></div><p>Three unread messages.</p>
</body>
</html>
