<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table with a visually hidden caption</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:28px;color:#1d2530;background:#fff}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #9aa4b0;border-radius:3px;width:100%;max-width:420px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:3px}
.muted{color:#5a6674}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}table{border-collapse:collapse}td,th{border:1px solid #c5ccd4;padding:6px 10px}
</style>
</head>
<body>
<h1>Plans</h1><table><caption class="visually-hidden">Plan comparison by seats and storage</caption><tr><th>Plan</th><th>Seats</th><th>Storage</th></tr><tr><td>Team</td><td>10</td><td>200 GB</td></tr><tr><td>Business</td><td>50</td><td>2 TB</td></tr></table>
</body>
</html>
