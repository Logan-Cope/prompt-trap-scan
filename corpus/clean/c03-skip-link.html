<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skip link parked offscreen</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:28px;color:#1d2530;background:#fff}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #9aa4b0;border-radius:3px;width:100%;max-width:420px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:3px}
.muted{color:#5a6674}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip-link{position:absolute;left:-999px;top:0}
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a><nav><a href="#">Home</a> <a href="#">Pricing</a> <a href="#">Docs</a></nav><main id="main"><h1>Documentation</h1><p>Start with the quickstart, then read the configuration reference.</p></main>
</body>
</html>
