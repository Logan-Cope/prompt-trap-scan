<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cookie banner and a collapsed mobile menu</title>
<style>
body{font:16px/1.55 system-ui,sans-serif;margin:0;padding:28px;color:#1d2530;background:#fff}
h1{font-size:22px;margin:0 0 6px}h2{font-size:17px;margin:20px 0 6px}
label{display:block;font-weight:600;margin:14px 0 4px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #9aa4b0;border-radius:3px;width:100%;max-width:420px;box-sizing:border-box}
button{font:inherit;padding:8px 16px;background:#1f3a5f;color:#fff;border:0;border-radius:3px}
.muted{color:#5a6674}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.menu{display:none}.cookie{position:fixed;bottom:0;left:0;right:0;background:#1d2530;color:#fff;padding:12px 28px}
</style>
</head>
<body>
<h1>Garden tools</h1><ul class="menu"><li>Home</li><li>Shop</li><li>Contact</li></ul><p>Hand-forged trowels and secateurs, made in small batches.</p><div class="cookie">We use cookies to remember your basket. <button type="button">Accept</button></div>
</body>
</html>
